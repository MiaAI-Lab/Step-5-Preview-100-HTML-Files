<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIRST LIGHT — A Valley at 04:50</title>
<style>
  :root{
    --ink:#eef4ff;
    --muted:rgba(238,244,255,.55);
    --line:rgba(238,244,255,.14);
    --cold:#8fd0ff;
    --warm:#ffc98a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Iowan Old Style",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:#0a1226;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .room{
    position:fixed;inset:0;z-index:0;
    background:linear-gradient(180deg,#1a2350 0%,#2b3a68 26%,#57497a 52%,#9a6a78 76%,#d99a72 100%);
    transition:filter 1.2s ease
  }
  #cv{position:fixed;inset:0;z-index:1;display:block}

  .ui{position:fixed;inset:0;z-index:3;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(18px,3.4vw,40px)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
  .k{font-family:var(--mono);font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--warm)}
  h1{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(28px,5.2vw,62px);line-height:.98;letter-spacing:-.02em;margin:10px 0 0}
  h1 b{font-style:normal;font-weight:400;color:var(--warm)}
  .top p{margin:12px 0 0;font-size:12px;line-height:1.75;max-width:32ch;color:var(--muted)}
  .mtr{text-align:right;font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);line-height:2.4}
  .mtr b{display:block;font-size:15px;color:var(--warm);font-weight:400;letter-spacing:.02em}

  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .tray{
    pointer-events:auto;display:flex;gap:clamp(8px,1.3vw,16px);flex-wrap:wrap;align-items:center;
    background:rgba(24,18,44,.55);border:1px solid var(--line);border-radius:16px;
    padding:11px clamp(12px,1.8vw,20px);backdrop-filter:blur(14px)
  }
  .g{display:flex;align-items:center;gap:8px}
  .kk{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .vv{font-family:var(--mono);font-size:9.5px;color:var(--warm);min-width:38px;font-variant-numeric:tabular-nums}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:64px;height:14px;background:transparent;cursor:pointer
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--warm);margin-top:-5px;border:0;box-shadow:0 0 10px rgba(255,201,138,.7)}
  input[type=range]::-moz-range-track{height:2px;background:var(--line);border-radius:2px}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--warm)}
  button{
    pointer-events:auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
    background:rgba(255,201,138,.14);border:1px solid rgba(255,201,138,.4);color:var(--ink);
    padding:9px 13px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s
  }
  button:hover{background:var(--warm);color:#2e1a08}
  button.on{background:var(--warm);color:#2e1a08}
  .hint{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(238,244,255,.4);pointer-events:none}

  @media (max-width:760px){.top p,.mtr,.hint{display:none}.ui{padding:14px}}
</style>
</head>
<body>
<div class="room" id="room"></div>
<canvas id="cv"></canvas>

<div class="ui">
  <div class="top">
    <div>
      <div class="k">Valley station · 04:50 local</div>
      <h1>The light arrives<br><b>at the far ridge first.</b></h1>
      <p>Nine ridges of atmospheric depth. The sun behind them all, and the shadow of
      each one climbing onto the next.</p>
    </div>
    <div class="mtr">
      Sun<b id="mS">−6.4°</b>
      Ridges<b id="mR">9</b>
      Contrast<b id="mC">0.18</b>
    </div>
  </div>

  <div class="bottom">
    <div class="tray">
      <div class="g"><span class="kk">Sun</span><input type="range" id="sn" min="-14" max="6" value="-6" aria-label="Sun altitude"><span class="vv" id="snV">−6</span></div>
      <div class="g"><span class="kk">Haze</span><input type="range" id="hz" min="0" max="100" value="46" aria-label="Haze"><span class="vv" id="hzV">46</span></div>
      <div class="g"><span class="kk">Ridges</span><input type="range" id="rd" min="4" max="12" value="9" aria-label="Ridge count"><span class="vv" id="rdV">9</span></div>
      <button id="mist" class="on">Mist</button>
      <button id="dawn">Dawn</button>
    </div>
    <div class="hint">The far ridge is the brightest thing in the frame</div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var cv=document.getElementById('cv'),c=cv.getContext('2d');
  var W,H,DPR=Math.min(window.devicePixelRatio||1,2);
  var sun=-6,haze=46,want=9,mist=true;
  var ridges=[];
  var t=0;

  function build(){
    ridges=[];
    var n=want;
    for(var i=0;i<n;i++){
      (function(k){
        var pts=[];
        var base=0.30+ k/n*0.44;
        var amp=0.05+Math.random()*0.06;
        var f=0.8+Math.random()*1.5;
        for(var x=0;x<=20;x++){
          var xx=x/20;
          var y=base+Math.sin(xx*6.283*f+k)*amp+Math.sin(xx*6.283*f*2.4+k*2)*amp*0.35;
          pts.push({x:xx,y:y});
        }
        ridges.push({pts:pts,k:k,amp:amp});
      })(i);
    }
  }
  function resize(){
    W=innerWidth;H=innerHeight;
    cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
    c.setTransform(DPR,0,0,DPR,0,0);
    build();
  }
  function mix(a,b,t2){return a+(b-a)*t2}
  function rgb(r,g,b,a){return 'rgba('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+','+(a===undefined?1:a).toFixed(3)+')'}

  function draw(){
    t+=0.016;
    c.setTransform(DPR,0,0,DPR,0,0);
    c.clearRect(0,0,W,H);

    /* sun altitude 0..1 (-14 = deep night, 6 = golden) */
    var sa=(sun+14)/20;
    /* sky above */
    var sky=c.createLinearGradient(0,0,0,H*0.78);
    sky.addColorStop(0, rgb(mix(14,70,sa),mix(20,86,sa),mix(48,140,sa)));
    sky.addColorStop(.42, rgb(mix(34,120,sa),mix(48,132,sa),mix(88,158,sa)));
    sky.addColorStop(.78, rgb(mix(96,214,sa),mix(70,158,sa),mix(112,152,sa)));
    sky.addColorStop(1, rgb(mix(200,232,sa),mix(140,190,sa),mix(120,144,sa)));
    c.fillStyle=sky;c.fillRect(0,0,W,H);

    /* the sun, low near the horizon */
    var sunX=W*0.5+Math.sin(t*0.02)*W*0.02;
    var sunY=H*(0.62-sa*0.22);
    if(sa>0.06){
      var R=Math.min(W,H)*(0.06+sa*0.03);
      var sg=c.createRadialGradient(sunX,sunY,0,sunX,sunY,R*7);
      sg.addColorStop(0,'rgba(255,246,214,.85)');
      sg.addColorStop(.10,'rgba(255,214,150,.42)');
      sg.addColorStop(1,'rgba(255,180,110,0)');
      c.fillStyle=sg;c.fillRect(0,0,W,H);
      c.fillStyle='rgba(255,250,228,.95)';
      c.beginPath();c.arc(sunX,sunY,R,0,6.283);c.fill();
    }

    /* the "glow path" the sun makes through the valleys */
    var hz=haze/100;

    /* ridges, far first */
    for(var r=0;r<ridges.length;r++){
      var rg=ridges[r];
      var near=r/(ridges.length-1||1);   /* 0 far, 1 near */
      var pts=rg.pts;
      /* atmospheric perspective: the further, the paler and cooler */
      var hazeAmt=(1-near)*0.72+hz*0.18;
      /* base near-colour mixed toward pale haze */
      var crr=mix(mix(30,150,near),235,hazeAmt);
      var cgr=mix(mix(40,140,near),225,hazeAmt);
      var cbr=mix(mix(70,120,near),230,hazeAmt);

      /* each ridge catches the sun on its crest and carries shadow on its lee */
      var lit=Math.max(0,sa*1.15-0.10)*(1-near*0.55);
      c.beginPath();
      for(var i=0;i<pts.length;i++){
        var x=pts[i].x*W;
        var y=pts[i].y*H;
        if(i===0)c.moveTo(x,y);else c.lineTo(x,y);
      }
      c.lineTo(W,H);c.lineTo(0,H);c.closePath();

      var g2=c.createLinearGradient(0,pts[0].y*H,0,H);
      g2.addColorStop(0, rgb(crr*(1+lit*0.9),cgr*(1+lit*0.7),cbr*(1-lit*0.2)));
      g2.addColorStop(0.28, rgb(crr*0.82,cgr*0.78,cbr*0.72));
      g2.addColorStop(1, rgb(crr*0.42,cgr*0.40,cbr*0.38));
      c.fillStyle=g2;c.fill();

      /* the lit crest: a bright hairline along the top of the ridge */
      if(lit>0.02){
        c.beginPath();
        for(i=0;i<pts.length;i++){
          var x2=pts[i].x*W, y2=pts[i].y*H;
          if(i===0)c.moveTo(x2,y2);else c.lineTo(x2,y2);
        }
        c.strokeStyle='rgba(255,236,198,'+(lit*0.55*(1-hazeAmt*0.5)).toFixed(3)+')';
        c.lineWidth=1.2;c.stroke();
      }

      /* the shadow of this ridge being cast onto the next */
      if(r<ridges.length-1){
        c.save();
        c.globalAlpha=1;
        c.beginPath();
        for(i=0;i<pts.length;i++){
          var x3=pts[i].x*W, y3=pts[i].y*H;
          if(i===0)c.moveTo(x3,y3);else c.lineTo(x3,y3);
        }
        c.lineTo(W,H);c.lineTo(0,H);c.closePath();
        c.clip();
        /* a soft dark wedge just below the crest */
        for(i=0;i<pts.length;i++){
          var x4=pts[i].x*W,y4=pts[i].y*H;
          var sh=c.createLinearGradient(0,y4,0,y4+H*0.14);
          sh.addColorStop(0,'rgba(20,20,50,'+(0.16+lit*0.10).toFixed(3)+')');
          sh.addColorStop(1,'rgba(20,20,50,0)');
          c.fillStyle=sh;
          c.fillRect(x4-3,y4,10,H*0.14);
        }
        c.restore();
      }
    }

    /* mist in the valley bottoms */
    if(mist){
      c.save();
      c.globalCompositeOperation='lighter';
      for(var m=0;m<7;m++){
        var my=H*(0.62+m*0.05)+Math.sin(t*0.1+m)*8;
        var mg=c.createLinearGradient(0,my-30,0,my+40);
        var al=(0.05-sun/14*0.04)*(1-hz*0.4);
        mg.addColorStop(0,'rgba(200,215,255,0)');
        mg.addColorStop(.5,'rgba(200,215,255,'+Math.max(0,al).toFixed(3)+')');
        mg.addColorStop(1,'rgba(200,215,255,0)');
        c.fillStyle=mg;
        c.fillRect(0,my-30,W,70);
      }
      c.restore();
    }

    /* haze washes the whole frame */
    if(hz>0){
      c.fillStyle='rgba(230,220,240,'+(hz*0.10).toFixed(3)+')';
      c.fillRect(0,0,W,H);
    }

    /* CSS room gradient follows the sun too */
    document.getElementById('room').style.filter='brightness('+(0.45+sa*0.55).toFixed(2)+') hue-rotate('+(sa*8-4).toFixed(1)+'deg)';

    document.getElementById('mS').textContent=sun.toFixed(1)+'\u00b0';
    document.getElementById('mR').textContent=ridges.length;
    document.getElementById('mC').textContent=(hz*0.6+0.1).toFixed(2);
    requestAnimationFrame(draw);
  }

  document.getElementById('sn').addEventListener('input',function(){
    sun=+this.value;document.getElementById('snV').textContent=sun;
  });
  document.getElementById('hz').addEventListener('input',function(){
    haze=+this.value;document.getElementById('hzV').textContent=haze;
  });
  document.getElementById('rd').addEventListener('input',function(){
    want=+this.value;document.getElementById('rdV').textContent=want;
    while(ridges.length>want)ridges.pop();
    while(ridges.length<want){
      var base=0.30+ridges.length/want*0.44;
      var amp=0.05+Math.random()*0.06;
      var f=0.8+Math.random()*1.5;
      var pts=[];
      for(var k=0;k<=20;k++){
        var xx=k/20;
        pts.push({x:xx,y:base+Math.sin(xx*6.283*f+ridges.length)*amp+Math.sin(xx*6.283*f*2.4+ridges.length*2)*amp*0.35});
      }
      ridges.push({pts:pts,k:ridges.length,amp:amp});
    }
  });
  var mb=document.getElementById('mist');
  mb.addEventListener('click',function(){mist=!mist;this.classList.toggle('on',mist);});
  var db=document.getElementById('dawn');
  var dTimer=null;
  db.addEventListener('click',function(){
    if(dTimer){clearInterval(dTimer);dTimer=null;this.textContent='Dawn';return;}
    this.textContent='Noon';
    dTimer=setInterval(function(){
      sun+=0.12;
      if(sun>6)sun=-14;
      document.getElementById('sn').value=Math.round(sun);
      document.getElementById('snV').textContent=Math.round(sun);
    },70);
  });

  addEventListener('resize',function(){clearTimeout(window.__r);window.__r=setTimeout(resize,140)});
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
